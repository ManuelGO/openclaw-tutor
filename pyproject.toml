[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-tutor"
version = "0.1.0"
description = "Personal learning tutor powered by RAG, OpenClaw and WhatsApp"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
